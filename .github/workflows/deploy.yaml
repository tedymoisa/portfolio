name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets (long-term cache)
        run: |
          aws s3 cp ./dist s3://${{ vars.S3_BUCKET_NAME }} \
            --recursive \
            --exclude "*" --include "_astro/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload HTML and other files (no cache)
        run: |
          aws s3 cp ./dist s3://${{ vars.S3_BUCKET_NAME }} \
            --recursive \
            --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Remove stale files from S3
        run: aws s3 sync ./dist s3://${{ vars.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
